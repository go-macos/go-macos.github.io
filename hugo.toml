baseURL = "https://go-macos.github.io/"
title = "go-macos"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

# One card per repository, and EVERY repository in the org has one. "reach" is
# the mechanism it actually uses to talk to the OS.
#
# "used_by" is measured, never guessed. It said "12 repositories depend on it"
# for objc when the answer was 21, which is what a hand-typed count does. Prefer
# naming the consumer over counting; when a number is worth having, re-measure it
# across the fleet first:
#
#	cd ~/Documents/VCS/GIT/github.com \\
#	  && grep -lE "github.com/go-macos/<pkg>( |$)" */*/go.mod | grep -v "^go-macos/<pkg>/"
[[params.repos]]
  name = "objc"
  reach = "dlopen + objc_msgSend, via ebitengine/purego"
  role = "foundation"
  used_by = "every other macOS package here rests on it"
  result = "The shared home for the Objective-C plumbing the fleet's CGO=0 macOS code kept re-implementing: cached selector/class lookup, NSString↔Go bridging, framework dlopen (Foundation, AppKit, WebKit, CoreFoundation, Security, libSystem), autorelease pools, run loops, runtime class registration, and a main-thread hop through libdispatch."
[[params.repos]]
  name = "keychain"
  reach = "dlsym'd CoreFoundation + Security, via ebitengine/purego"
  role = "secret store"
  used_by = "6 repositories in the fleet require it"
  result = "Generic-password items over a (service, account) pair — Set, Get, Delete — with typed errors comparable through errors.Is / errors.As. It never shells out to /usr/bin/security, so the secret never appears in any process's argv."
[[params.repos]]
  name = "notify"
  reach = "Darwin notify(3), NSDistributedNotificationCenter, NSUserNotificationCenter"
  role = "notifications"
  used_by = "the macOS counterpart to go-freedesktop/notifications"
  result = "Three mechanisms behind one package: named cross-process signals with no payload, distributed notifications carrying a map[string]string userInfo, and user-visible notifications. Each row of its table states plainly whether it is cross-process and whether it needs a run loop."
[[params.repos]]
  name = "screencapture"
  reach = "ScreenCaptureKit, via ebitengine/purego"
  role = "capture"
  used_by = "go-xrkit/desk streams the screens it draws through it"
  result = "Enumerate displays and windows and stream their pixels as borrowed BGRA, allocation-free per frame. Frames arrive only when something changes, as ScreenCaptureKit is change-driven. Capturing another process's content needs the Screen Recording grant and says so in the error; capturing your OWN window needs no grant at all, which is how its live tests prove themselves on a machine that never granted one."
[[params.repos]]
  name = "virtualdisplay"
  reach = "PRIVATE CoreGraphics CGVirtualDisplay classes, via ebitengine/purego"
  role = "displays"
  used_by = "go-xrkit/desk creates the screens it puts on the ribbon"
  result = "Displays macOS extends the desktop onto that no cable is attached to — real CGDirectDisplayIDs, in System Settings, capturable. It rests on UNDOCUMENTED CoreGraphics classes: Apple may remove them in any release, and a program linking it cannot ship on the Mac App Store. It never sends a message it has not first verified, so a missing class is an error and not a crash."
[[params.repos]]
  name = "iokit"
  reach = "IOKit HID, via ebitengine/purego"
  role = "devices"
  used_by = "how the XR glasses' HID interfaces were surveyed; nothing in the fleet requires it yet"
  result = "HID device enumeration, report writing and input-report streaming, with no cgo, no hidapi and no shelling out to ioreg."
[[params.repos]]
  name = "avfoundation"
  reach = "AVAssetReader, via ebitengine/purego"
  role = "video decode"
  used_by = "go-xrkit/player decodes film through it"
  result = "Hardware-accelerated video decoding through the AVAssetReader pull API: zero-copy BGRA frames carrying their presentation timestamps."
[[params.repos]]
  name = "videotoolbox"
  reach = "VideoToolbox, via ebitengine/purego"
  role = "video decode"
  used_by = "go-xrkit/player, for the containers AVFoundation will not open"
  result = "Hardware H.264 and HEVC decoding — the path AVFoundation cannot take, because AVFoundation does not demux Matroska."
[[params.repos]]
  name = "audiotoolbox"
  reach = "AudioToolbox, via ebitengine/purego"
  role = "audio"
  used_by = "go-xrkit/player plays sound through it"
  result = "Decode compressed audio and play PCM, CGO_ENABLED=0 throughout."
[[params.repos]]
  name = "accessibility"
  reach = "Accessibility (AX) API, via ebitengine/purego"
  role = "windows"
  used_by = "go-xrkit/desk puts applications on the ribbon's screens with it"
  result = "Move another application's window to a chosen display. It needs the Accessibility grant and says so plainly rather than failing silently, and it never trusts a write: every move is read back, and a window that did not go where it was told is a refusal with both frames in the message. Two rules in it came from measurement, not documentation — a window is SHRUNK BEFORE being moved, because the window server clamps a move by the size the window has at the moment of the write, and a window too big for its destination is walked one display closer per write rather than refused, so it keeps writing while each write brings the window nearer."
[[params.repos]]
  name = "hotkey"
  reach = "Carbon RegisterEventHotKey, via ebitengine/purego"
  role = "shortcuts"
  used_by = "go-xrkit/desk claims fourteen of them"
  result = "System-wide keyboard shortcuts with NO permission dialog at all — Carbon's hot-key API is the one path on macOS that needs neither Accessibility nor Input Monitoring. When the combination you asked for is already taken it falls back to a neighbour and tells you, in glyphs, which one it got, so a program can print what a person should actually press."
[[params.repos]]
  name = "statusitem"
  reach = "NSStatusBar, NSStatusItem and NSMenu, via ebitengine/purego"
  role = "menu bar"
  used_by = "go-xrkit/desk hangs its 👓 menu there"
  result = "An item in the menu bar — what everyone calls a tray icon — from pure Go. A row carries a title, an optional key equivalent and a Go func; an empty row is a separator. It matters most for a program with no window of its own, or one whose window is not there yet: the menu is where a person clicks when there is nothing else to click."
[[params.repos]]
  name = "pointer"
  reach = "CGWarpMouseCursorPosition and CGEventGetLocation, via ebitengine/purego"
  role = "pointer"
  used_by = "go-xrkit/desk brings the pointer to the screen you are looking at"
  result = "Says where the pointer is and puts it somewhere else, with no permission of any kind. It exists because of a measured failure: an application that shows one display inside another gives a person a picture of somewhere the pointer can go and no way to get it there, and dragging the mouse across a captured screen is dragging it blind. It moves the pointer and does not click — nothing here synthesises a button event."
[[params.repos]]
  name = "fileprogress"
  reach = "NSProgress published to the system, via ebitengine/purego"
  role = "progress"
  used_by = "nothing in the fleet yet"
  result = "Tells macOS a file is being downloaded, so the Finder draws the pie it draws for a browser's downloads. The pie is not something the system works out by watching a file grow: it has to be PUBLISHED, and there is exactly one way of being heard. An extended attribute on the file looks like it ought to work, is documented in various corners of the internet, and does nothing — measured against a real Finder before this package was written."
[[params.repos]]
  name = "appicon"
  reach = "NSRunningApplication and NSBitmapImageRep, via ebitengine/purego"
  role = "icons"
  used_by = "go-xrkit/desk shows what is running, with the icons"
  result = "A running application's own icon, as straight RGBA, at the size you ask for — and no permission of any kind, because an icon is public information about a process where its windows are not. A size is asked for rather than inferred: an icon is a FAMILY of representations, 32 of them for Firefox, so asking for 64 gets the 64 the designer drew where scaling \"the\" icon gets a blurred 512. Three measured traps are documented beside the lines they explain — NSRunningApplication answers from a cache that needs the run loop pumped, a class that was never loaded answers zero rather than erroring, and a bitmap context cannot draw non-premultiplied, which makes graphicsContextWithBitmapImageRep: return nil."
[[params.repos]]
  name = "appbundle"
  reach = "the .app directory itself — path and plist work, no AppKit"
  role = "bundles"
  used_by = "go-downloader/godl ships as an .app built by it"
  result = "Says whether the running process is inside an .app, and assembles one around an executable. It touches no framework at all, which is the point: a bundle assembler is needed in a BUILD, on whatever machine the build runs on, so this one compiles and is tested on linux and windows too. What it encodes is that a bare executable is not an application on this system — asked for from outside a bundle, a status item is asked for by nobody, appears nowhere, and the process ends without complaining."
[[params.repos]]
  name = "brightness"
  reach = "DisplayServicesGet/SetBrightness — a PRIVATE framework, looked up at run time"
  role = "backlight"
  used_by = "go-xrkit/desk darkens the Mac's panel while the glasses show it"
  result = "Reads and sets a display's backlight, and hands back the way home. It exists for the screen that is being shown SOMEWHERE ELSE: mirrored into a pair of display glasses, the physical panel is a copy of private work at reading distance, facing whoever walks past, lit at full power for nobody. Turning the backlight off beats covering the screen with a black window — the framebuffer is untouched, so a capture of that display is unchanged, and there is no window for something else to raise itself above. Two things are documented because they were measured: the documented IODisplay route does not drive an Apple Silicon built-in panel at all, and DisplayServicesSetBrightness answers success for a display id no machine has, which is why Dim READS before it changes anything."
