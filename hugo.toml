baseURL = "https://go-macos.github.io/"
title = "go-macos"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

# One card per repository. "reach" is the mechanism it actually uses to talk to
# the OS, and "used_by" is a measured count of repositories in the fleet whose
# go.mod requires it -- not an aspiration.
[[params.repos]]
  name = "objc"
  reach = "dlopen + objc_msgSend, via ebitengine/purego"
  role = "foundation"
  used_by = "12 repositories depend on it"
  result = "The shared home for the Objective-C plumbing the fleet's CGO=0 macOS code kept re-implementing: cached selector/class lookup, NSString↔Go bridging, framework dlopen (Foundation, AppKit, WebKit, CoreFoundation, Security, libSystem), autorelease pools, run loops, runtime class registration, and a main-thread hop through libdispatch."
[[params.repos]]
  name = "keychain"
  reach = "dlsym'd CoreFoundation + Security, via ebitengine/purego"
  role = "secret store"
  used_by = "7 repositories depend on it"
  result = "Generic-password items over a (service, account) pair — Set, Get, Delete — with typed errors comparable through errors.Is / errors.As. It never shells out to /usr/bin/security, so the secret never appears in any process's argv."
[[params.repos]]
  name = "notify"
  reach = "Darwin notify(3), NSDistributedNotificationCenter, NSUserNotificationCenter"
  role = "notifications"
  used_by = "the macOS counterpart to go-freedesktop/notifications"
  result = "Three mechanisms behind one package: named cross-process signals with no payload, distributed notifications carrying a map[string]string userInfo, and user-visible notifications. Each row of its table states plainly whether it is cross-process and whether it needs a run loop."
[[params.repos]]
  name = "screencapture"
  reach = "ScreenCaptureKit, via ebitengine/purego"
  role = "capture"
  used_by = "go-xrkit/desk streams the screens it draws through it"
  result = "Enumerate displays and windows and stream their pixels as borrowed BGRA, allocation-free per frame. Frames arrive only when something changes, as ScreenCaptureKit is change-driven. Capturing another process's content needs the Screen Recording grant and says so in the error; capturing your OWN window needs no grant at all, which is how its live tests prove themselves on a machine that never granted one."
[[params.repos]]
  name = "virtualdisplay"
  reach = "PRIVATE CoreGraphics CGVirtualDisplay classes, via ebitengine/purego"
  role = "displays"
  used_by = "go-xrkit/desk creates the screens it puts on the ribbon"
  result = "Displays macOS extends the desktop onto that no cable is attached to — real CGDirectDisplayIDs, in System Settings, capturable. It rests on UNDOCUMENTED CoreGraphics classes: Apple may remove them in any release, and a program linking it cannot ship on the Mac App Store. It never sends a message it has not first verified, so a missing class is an error and not a crash."
[[params.repos]]
  name = "iokit"
  reach = "IOKit HID, via ebitengine/purego"
  role = "devices"
  used_by = "how the XR glasses' HID interfaces were surveyed; nothing in the fleet requires it yet"
  result = "HID device enumeration, report writing and input-report streaming, with no cgo, no hidapi and no shelling out to ioreg."
[[params.repos]]
  name = "avfoundation"
  reach = "AVAssetReader, via ebitengine/purego"
  role = "video decode"
  used_by = "go-xrkit/player decodes film through it"
  result = "Hardware-accelerated video decoding through the AVAssetReader pull API: zero-copy BGRA frames carrying their presentation timestamps."
[[params.repos]]
  name = "videotoolbox"
  reach = "VideoToolbox, via ebitengine/purego"
  role = "video decode"
  used_by = "go-xrkit/player, for the containers AVFoundation will not open"
  result = "Hardware H.264 and HEVC decoding — the path AVFoundation cannot take, because AVFoundation does not demux Matroska."
[[params.repos]]
  name = "audiotoolbox"
  reach = "AudioToolbox, via ebitengine/purego"
  role = "audio"
  used_by = "go-xrkit/player plays sound through it"
  result = "Decode compressed audio and play PCM, CGO_ENABLED=0 throughout."
